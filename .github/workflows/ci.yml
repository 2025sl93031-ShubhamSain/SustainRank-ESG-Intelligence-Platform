name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Secret Scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test (Java 21)
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Write application.properties for CI
        run: |
          cat > backend/src/main/resources/application.properties <<EOF
          server.port=8000
          spring.datasource.url=jdbc:postgresql://localhost:5432/${{ secrets.CI_POSTGRES_DB }}
          spring.datasource.username=${{ secrets.CI_POSTGRES_USER }}
          spring.datasource.password=${{ secrets.CI_POSTGRES_PASSWORD }}
          spring.jpa.hibernate.ddl-auto=update
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.show-sql=false
          spring.jackson.serialization.write-dates-as-timestamps=false
          jwt.secret=${{ secrets.CI_JWT_SECRET }}
          jwt.expiration-ms=86400000
          cors.allowed-origins=http://localhost:5173
          logging.level.com.sustainability=INFO
          EOF

      - name: Build with Maven
        run: cd backend && mvn clean package -DskipTests --no-transfer-progress

      - name: Run tests
        run: cd backend && mvn test --no-transfer-progress

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Install & Lint (Node 20)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build
